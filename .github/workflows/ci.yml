# Checks that need no GPU, no Chrome and no Aseprite (journal pass Q1): types, production bundle, Art Lab provenance and the unit
# tests of the pure logic (node --test). The GPU, pixel, cadence and Aseprite proofs under tools/ stay local (AGENTS.md "Commands").
# puppeteer-core downloads no browser at install; nothing here starts one.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, build, art:validate, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run art:validate
      - run: npm test
